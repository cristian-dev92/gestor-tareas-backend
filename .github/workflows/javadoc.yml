name: Generar y Desplegar Javadoc Automatizado

on:
  push:
    branches:
      - main  # Se ejecuta cada vez que subes algo a main

permissions:
  contents: write  # Permiso para que el robot pueda escribir en la rama gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 📝 Generar Javadoc con Maven
        run: mvn javadoc:javadoc -Djavadoc.encoding=UTF-8 -Djavadoc.docencoding=UTF-8 -Djavadoc.charset=UTF-8

      - name: 🚀 Desplegar en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/site/apidocs # Carpeta donde Maven guarda el Javadoc por defecto
          branch: gh-pages # Rama donde se subirá la web de la documentación